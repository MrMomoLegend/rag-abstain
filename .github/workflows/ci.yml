name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,plot]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: python -m pytest

  old-typer:
    # Pipelines built on huggingface-hub pin typer<0.26: test the floor and the demo's version.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typer-version: ["0.20.0", "0.25.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]" "typer==${{ matrix.typer-version }}"
      - name: Test
        run: python -m pytest
