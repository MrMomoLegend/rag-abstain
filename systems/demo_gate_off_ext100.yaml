# demo_gate_off.yaml for datasets/ext100.csv: the same system, plus clarification markers.
# rag-assistant-demo with its distance gate off: prompt-only abstention (DESIGN section 13,
# system 2). Every question reaches the model and the run records the nearest distance for each,
# so `rag-abstain sweep` can replay the gate offline. Same requirements as demo_gate_on.yaml.
name: demo-gate-off-ext100
adapter: python
target: rag.pipeline:answer_question
pythonpath: ../../rag-assistant-demo   # resolved relative to this file
params: {use_rag: true, use_threshold: false}
response_map: demo
refusal_text: "The provided documents do not contain this information."
# Clarifying questions count as declines: the ideal reply to an underspecified question in
# datasets/ext100.csv is to ask which model, system or dataset is meant (UAEval4RAG).
extra_markers:
  - "could you clarify"
  - "can you clarify"
  - "please clarify"
  - "could you specify"
  - "can you specify"
  - "please specify"
  - "are you referring to"
  - "do you mean"
